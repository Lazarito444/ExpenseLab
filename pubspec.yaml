name: expenselab
description: "ExpenseLab is a mobile-first personal finance management
  application designed to help users track income, expenses, savings, and
  budgets with an organic, modern, and intuitive interface. The app focuses on
  visual clarity and actionable insights to promote financial well-being."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  cupertino_icons: ^1.0.8
  drift: ^2.33.0
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  local_auth: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  slang: ^4.14.0
  slang_flutter: ^4.14.0
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

dependency_overrides:
  test_api: ^0.7.12

flutter:
  uses-material-design: true
  fonts:
    - family: Epilogue
      fonts:
        - asset: assets/fonts/Epilogue-Regular.ttf
          weight: 400
        - asset: assets/fonts/Epilogue-Medium.ttf
          weight: 500
        - asset: assets/fonts/Epilogue-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Epilogue-Bold.ttf
          weight: 700
        - asset: assets/fonts/Epilogue-ExtraBold.ttf
          weight: 800
